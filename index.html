<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/modern-normalize.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="promo-modal">
      <div class="promo-modal__banner">
        <img
          src="images/banner.png"
          srcset="images/banner.png 1x, images/banner@2x.png 2x"
          alt="Designer banners preview"
          class="promo-modal__banner-img"
        />
      </div>

      <div class="promo-modal__content">
        <div class="promo-modal__text-wrapper">
          <h2 class="promo-modal__title">
            Join now for $1 and get <br />
            a bonus pack of designer banners
          </h2>

          <p class="promo-modal__text">
            Launch faster with Oscar Chat and receive monthly seasonal banner packs designed to
            boost sales.
          </p>
        </div>

        <a href="#" class="promo-modal__button">
          <span>Join Now</span>
          <span class="promo-modal__button-icon">
            <span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="28"
                height="28"
                fill="none"
                viewBox="0 0 62 62"
              >
                <path
                  stroke="#fff"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="5.148"
                  d="M18.02 18.02h25.74v25.74M18.02 43.76l25.74-25.74"
                />
              </svg>
            </span>
          </span>
        </a>
      </div>
    </div>
  </body>
</html>
